---
# yamllint disable rule:comments rule:line-length rule:truthy
# Publishes the app's image, ghcr.io/ohf-voice/app-voice-incubator (amd64 and
# aarch64), which Home Assistant pulls when the app is installed from this
# repository: a published release as its version (the version config.yaml
# says), run by hand as "dev". The build and manifest steps of
# home-assistant/workflows' app-deploy.yaml, which only runs in
# home-assistant's repositories, without its app store announcements.
name: Deploy

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-deploy-${{ github.event_name == 'release' && 'release' || 'edge' }}

env:
  APP_PATH: voice_incubator
  BASE_IMAGE_IDENTITY: ^https://github\.com/home-assistant/docker-base/\.github/workflows/build-base-image\.yml@refs/tags/[0-9]+\.[0-9]+\.[0-9]+$

jobs:
  information:
    name: Gather app information
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      base_image: ${{ steps.base.outputs.image }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      description: ${{ steps.normalize.outputs.description }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      name: ${{ steps.normalize.outputs.name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      url: ${{ steps.normalize.outputs.url }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
        with:
          path: ./${{ env.APP_PATH }}

      - name: Normalize app information
        id: normalize
        env:
          IMAGE: ${{ fromJSON(steps.info.outputs.image) }}
          NAME: ${{ fromJSON(steps.info.outputs.name) }}
          DESCRIPTION: ${{ fromJSON(steps.info.outputs.description) }}
          URL: ${{ fromJSON(steps.info.outputs.url) }}
        run: |
          if [[ -z "${IMAGE}" || "${IMAGE}" == *"{arch}"* ]]; then
            echo "::error::Config option 'image' must be set to a generic image name without '{arch}'"
            exit 1
          fi
          {
            echo "image_name=${IMAGE##*/}"
            echo "registry_prefix=${IMAGE%/*}"
            echo "name=${NAME}"
            echo "description=${DESCRIPTION//$'\n'/ }"
            echo "url=${URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Find signed base image
        id: base
        env:
          DOCKERFILE: ./${{ env.APP_PATH }}/Dockerfile
        run: |
          base=$(sed -n 's/^ARG BUILD_FROM="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "${DOCKERFILE}" | head -n 1)
          if [[ "${base}" =~ ^ghcr\.io/home-assistant/(base|base-python|base-debian|base-ubuntu)(:|@) ]]; then
            echo "image=${base}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Base image '${base}' is not verified with Cosign"
          fi

      # A release publishes the version Home Assistant asks for: the one in
      # config.yaml, which its tag must be.
      - name: Gather version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          CONFIG_VERSION: ${{ fromJSON(steps.info.outputs.version) }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "release" ]]; then
            version="${TAG_NAME#v}"
            if [[ "${version}" != "${CONFIG_VERSION}" ]]; then
              echo "::error::Release ${TAG_NAME} is not config.yaml's version ${CONFIG_VERSION}"
              exit 1
            fi
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=${SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "image_tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: information
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Issue OIDC token for Cosign signing
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.information.outputs.build_matrix) }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ env.APP_PATH }}
          cache-image-tag: dev
          cosign-base-verify: ${{ needs.information.outputs.base_image }}
          cosign-base-identity: ${{ env.BASE_IMAGE_IDENTITY }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.information.outputs.version }}
            ${{ needs.information.outputs.image_tag }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.information.outputs.name }}
            io.hass.description=${{ needs.information.outputs.description }}
            ${{ needs.information.outputs.url && format('io.hass.url={0}', needs.information.outputs.url) || '' }}
          push: "true"
          version: ${{ needs.information.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs:
      - information
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Issue OIDC token for Cosign signing
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ needs.information.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.information.outputs.image_name }}
          image-tags: |
            ${{ needs.information.outputs.version }}
            ${{ needs.information.outputs.image_tag }}
          registry-prefix: ${{ needs.information.outputs.registry_prefix }}
