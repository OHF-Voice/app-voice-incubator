---
version: 0.2.1
slug: voice_incubator
name: Voice Incubator
description: Voice satellites with your own commands, recognized on this machine
url: https://github.com/OHF-Voice/app-voice-incubator
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
# mDNS discovery of satellites, and connecting to them.
host_network: true
ingress: true
# /config: custom wake words (wake_words/) and the wake word training kit
# (wake_training/), reachable from the Samba and file
# editor apps as addon_configs/<slug>_voice_incubator.
map:
  - addon_config:rw
ingress_port: 8099
panel_icon: mdi:account-voice
panel_title: Voice Incubator
# Home Assistant's pipelines: the app's speech-to-text, text-to-speech and
# conversation agent over Wyoming (voice_incubator/wyoming_server.py),
# announced to Home Assistant.
discovery:
  - wyoming
options:
  speaker_threshold: 0.45
  silence_seconds: 1.0
  wyoming_port: 10800
  debug_logging: false
schema:
  # Required, with no default: the app won't start until one is picked.
  language: list(en|de|es|fr|it|nl|pl|ru|uk)
  wake_cutoff: float(0.05,1)?
  speaker_threshold: float(0,1)
  silence_seconds: float(0.3,5)
  wyoming_port: int(0,65535)
  debug_logging: bool
homeassistant: 2025.10.0
# What the app store pulls once it is published. A local app built from
# this folder must not say it: Home Assistant would pull it instead.
image: ghcr.io/ohf-voice/app-voice-incubator
